[package]
name = "gpui-tray"
version = "0.1.0"
edition.workspace = true
publish = false
description = "System tray / menu-bar icon support for GPUI applications"

[dependencies]
gpui.workspace = true
anyhow.workspace = true
log.workspace = true
flume = "0.11"
parking_lot = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.20"

[lints]
workspace = true
