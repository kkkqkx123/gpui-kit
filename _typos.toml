[default]
# The v0.8.0 release notes credit two contributors whose GitHub handles the
# tokenizer reads as misspelled words; ignoring the exact handles keeps the
# rest of the file checked.
extend-ignore-re = [
    '\\u\{[0-9A-Fa-f]+\}',
    '@UncertaintyDeterminesYou4ndMe',
    '@alex-vas',
]

[default.extend-words]
# Official Lucide icon name for the astroid curve.
astroid = "astroid"
# Correct Italian singular of "command".
comando = "comando"
# A deliberately misspelled manifest key: `crates/shell/src/plugin.rs` refuses
# it by name, and the test that proves it has to contain the misspelling.
capabilites = "capabilites"
# Misspellings that only exist inside assertions proving a name is refused.
backgrund = "backgrund"
wtach = "wtach"
netwrok = "netwrok"
workspce = "workspce"

[files]
# The submodules are separate repositories with their own checks; their sources
# are not part of this repository's text.
extend-exclude = [
    "crates/story/src/fixtures/",
    "crates/autostart/",
    "crates/compograph/",
    "crates/tray/",
]
